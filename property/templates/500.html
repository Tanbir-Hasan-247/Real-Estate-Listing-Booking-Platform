<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>500 — Service Interrupted | PropNest Real Estate</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d3a5e;
      color: #f4ece1;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }
    .box {
      max-width: 560px;
      width: 100%;
      padding: 2.5rem;
      border-radius: 20px;
      border: 1px solid rgba(244, 236, 225, 0.2);
      background: rgba(8, 36, 59, 0.9);
      text-align: center;
    }
    .kicker {
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.72rem;
      color: #f05a1a;
      margin: 0;
    }
    h1 { font-size: 1.9rem; font-weight: 400; margin: 0.65rem 0; }
    p { opacity: 0.78; line-height: 1.6; }
    .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem; }
    a {
      display: inline-block;
      padding: 0.7rem 1.25rem;
      border-radius: 9999px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(244, 236, 225, 0.3);
      color: #f4ece1;
    }
    a.primary { background: #f05a1a; border-color: #f05a1a; color: #fff; }
  </style>
</head>
<body>
  <main class="box">
    <p class="kicker">HTTP 500 · Temporary Service Interruption</p>
    <h1>Architectural studio temporarily offline</h1>
    <p>An unexpected server error occurred while assembling this view. Our technical team has been notified — please retry in a moment.</p>
    <div class="actions">
      <a href="/" class="primary">Return Home</a>
      <a href="/properties/">Residences Catalog</a>
    </div>
  </main>
</body>
</html>
