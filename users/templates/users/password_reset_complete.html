{% extends "base.html" %}

{% block title %}Password Updated — PropNest Real Estate{% endblock %}

{% block content %}
<div class="pn-page">
  <div class="pn-container">
    <div class="pn-auth-wrap">
      <section class="pn-card pn-stack-md" style="padding:clamp(1.75rem, 4vw, 3rem);text-align:center;">
        <p class="pn-kicker">Complete</p>
        <h1 class="pn-h2" style="margin:0;">Your Password Has Been Reset</h1>
        <p class="pn-muted" style="margin:0;">Your account credentials have been updated. Sign in with your new password.</p>
        <div class="pn-row" style="justify-content:center;">
          <a href="{% url 'login' %}" class="pn-btn pn-btn-primary">Sign In →</a>
        </div>
      </section>
    </div>
  </div>
</div>
{% endblock %}
